<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureDrive X</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">

    <div class="logo">
        FutureDrive X
    </div>

    <ul class="menu">
        <li><a href="index.html">Главная</a></li>
        <li><a href="tecnologies.html">Технологии</a></li>
        <li><a href="test-drive.html">Тест-драйв</a></li>
    </ul>

    <button id="themeBtn">
        🌙
    </button>

</nav>

<section class="hero">

    <div class="hero-content">

        <h1 id="heroTitle">
            FutureDrive X
        </h1>

        <p>
            Электромобиль нового поколения
        </p>

        <a href="test-drive.html" class="hero-btn">
            Записаться на тест-драйв
        </a>

    </div>

    <img
            id="carImage"
            class="hero-car"
            src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1200"
            alt="car">

</section>

<section class="features">

    <div class="card">
        <h3>⚡ 800 км</h3>
        <p>Запас хода</p>
    </div>

    <div class="card">
        <h3>🚀 3.5 сек</h3>
        <p>Разгон до 100 км/ч</p>
    </div>

    <div class="card">
        <h3>🔋 15 мин</h3>
        <p>Быстрая зарядка</p>
    </div>

    <div class="card">
        <h3>🌍 ECO</h3>
        <p>Нулевые выбросы</p>
    </div>

</section>

<section class="gallery">

    <h2>Галерея</h2>

    <div class="slider">

        <button id="prev">
            ❮
        </button>

        <img
                id="sliderImage"
                src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1200"
                alt="car">

        <button id="next">
            ❯
        </button>

    </div>

</section>

<script src="js/main.js"></script>

</body>
</html>
